<style>
  :root{
    --black:#111;
    --font:"Helvetica Neue", Helvetica, Arial, sans-serif;
    --cursive:"Cormorant Garamond", "Times New Roman", Georgia, serif;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#111;color:#fff;font-family:var(--font);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-transform:inherit;letter-spacing:inherit}
  img{display:block}
  .tiny{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}

  /* ONE PAGE, TWO VIEWS
     body.prelaunch = countdown view (photo of Yunji, countdown, waitlist, password)
     no class       = home view (video, slogan, shop buttons) — after launch, or after the password */
  body.prelaunch .home-only{display:none !important}
  body:not(.prelaunch) .pre-only{display:none !important}

  /* ---------- HEADER ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 32px;
    transition:color .6s var(--ease);
  }
  .h-left,.h-right{display:flex;gap:28px;align-items:center}
  .h-right{justify-content:flex-end}
  .h-left a,.h-right a{position:relative}
  .h-left a::after,.h-right a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
  .h-left a:hover::after,.h-right a:hover::after{transform:scaleX(1)}
  .logo img{height:46px;width:auto;filter:invert(1);transition:filter .6s var(--ease)}   /* black logo shown white on the video */
  .burger{display:none;align-items:center;gap:8px}
  .ico{width:12px;height:12px}

  /* ---------- HERO: video (home view) / photo (countdown view) ---------- */
  .hero{position:fixed;inset:0;overflow:hidden;background:#1a1b1a}
  .hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:49% 50%;
    opacity:0;transition:opacity 1.2s var(--ease)}
  .hero video.ready{opacity:1}
  .hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:64% 28%;
    opacity:0;transition:opacity 1.2s var(--ease);display:none}
  .hero-photo.ready{opacity:1}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to bottom,rgba(0,0,0,.3),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.35))}
  .hero-copy{
    position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;
  }
  .hero-copy > *{opacity:0;transform:translateY(12px);animation:rise 1.2s var(--ease) forwards}
  .hero-copy > *:nth-child(2){animation-delay:.15s}
  .hero-copy > *:nth-child(3){animation-delay:.3s}
  .hero-copy > *:nth-child(4){animation-delay:.45s}
  .hero-copy > *:nth-child(5){animation-delay:.6s}
  .hero-copy > *:nth-child(6){animation-delay:.75s}
  .eyebrow{opacity:.85;letter-spacing:.24em;margin-bottom:-8px}
  @keyframes rise{to{opacity:1;transform:none}}

  /* home view: slogan + buttons */
  .season{font-family:var(--cursive);font-style:italic;font-weight:400;font-size:min(44px,4.6vw);line-height:1.2;letter-spacing:.005em;white-space:nowrap}
  .m-br{display:none}
  .ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

  /* countdown */
  .launch{display:flex;flex-direction:column;align-items:center;gap:10px}
  .countdown{display:flex;align-items:flex-start;gap:14px}
  .cd-unit{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:54px}
  .cd-num{font-size:34px;font-weight:300;letter-spacing:.02em;line-height:1;font-variant-numeric:tabular-nums}
  .cd-lbl{opacity:.75;font-size:9px;letter-spacing:.18em}
  .cd-sep{font-size:28px;font-weight:200;line-height:1;opacity:.5}
  .cd-note{opacity:.8;letter-spacing:.2em}

  /* waitlist */
  .waitlist{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(420px,86vw)}
  .wl-label{opacity:.9}
  .wl-row{display:flex;width:100%}
  .wl-row input[type=email]{
    flex:1;min-width:0;height:48px;padding:0 16px;background:rgba(0,0,0,.18);color:#fff;
    border:1px solid rgba(255,255,255,.9);border-right:0;border-radius:0;outline:none;
    font:inherit;font-size:13px;letter-spacing:.02em;-webkit-appearance:none;appearance:none;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:background .3s;
  }
  .wl-row input[type=email]::placeholder{color:rgba(255,255,255,.7)}
  .wl-row input[type=email]:focus{background:rgba(0,0,0,.32)}
  .wl-row .cta{height:48px;padding:0 22px;cursor:pointer}
  .wl-row .cta:disabled{opacity:.6;cursor:wait}
  .waitlist.bad input[type=email]{border-color:#ffb4ab}
  .wl-msg{min-height:14px;opacity:.9}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

  /* password lock (early access before the countdown ends) */
  .lock{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(420px,86vw)}
  .lock-toggle{display:inline-flex;align-items:center;gap:8px;opacity:.8;transition:opacity .2s}
  .lock-toggle:hover{opacity:1}
  .lock-toggle svg{width:10px;height:12px}
  .lock-form{display:none;width:100%;flex-direction:column;align-items:center;gap:10px}
  .lock.open .lock-form{display:flex}
  .lock.open .lock-toggle{display:none}
  .lock-form input{
    flex:1;min-width:0;height:48px;padding:0 16px;background:rgba(0,0,0,.18);color:#fff;
    border:1px solid rgba(255,255,255,.9);border-right:0;border-radius:0;outline:none;
    font:inherit;font-size:13px;letter-spacing:.3em;-webkit-appearance:none;appearance:none;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .lock-form input::placeholder{color:rgba(255,255,255,.7);letter-spacing:.02em}
  .lock.bad .lock-form input{border-color:#ffb4ab}
  @keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .lock.bad .wl-row{animation:shake .4s ease}

  .cta{
    position:relative;overflow:hidden;display:inline-block;border:1px solid rgba(255,255,255,.9);
    padding:15px 22px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;white-space:nowrap;
    transition:color .45s var(--ease);
  }
  .cta::before{content:"";position:absolute;inset:0;background:#fff;transform:translateY(101%);transition:transform .45s var(--ease)}
  .cta span{position:relative}
  .cta:hover{color:var(--black)}
  .cta:hover::before{transform:none}
  .pause{position:absolute;z-index:3;right:32px;bottom:26px;opacity:.8}
  .pause:hover{opacity:1}

  /* ---------- MENU PANEL ---------- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;bottom:0;left:0;width:min(400px,92vw);background:#fff;color:var(--black);z-index:50;padding:28px;
    transform:translateX(-100%);transition:transform .45s var(--ease)}
  .panel.on{transform:none}
  .panel .close{position:absolute;top:24px;right:28px}
  .panel h3{margin:4px 0 36px}
  .menu-links a{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:9px 0;transition:padding .25s var(--ease)}
  .menu-links a:hover{padding-left:8px}

  @media (max-width:900px){
    header{padding:14px 16px}
    .h-left a,.h-right .hide-m{display:none}
    .burger{display:flex}
    .logo img{height:38px}

  /* phones */
  @media (max-width:600px){

    .season{white-space:normal;font-size:min(36px,7vw)}
    .season .l1,.season .l2{white-space:nowrap}
    .m-br{display:inline}
    .ctas{flex-direction:column;width:100%;max-width:300px}
    .ctas .cta{text-align:center;padding:17px 22px}
    .countdown{gap:8px}
    .cd-unit{min-width:46px}
    .cd-num{font-size:28px}
    .cd-sep{font-size:22px}
    .waitlist{width:100%;gap:16px}
    .wl-label{letter-spacing:.18em}
    .wl-row input[type=email]{height:52px;font-size:16px}   /* 16px stops iPhone zooming in */
    .wl-row .cta{height:52px;padding:0 20px}
    .lock{width:100%;margin-top:4px}
    .lock-form input{height:52px;font-size:16px}
    .lock-form .cta{height:52px}
  }
  @media (max-width:600px) and (max-height:700px){
    .hero-copy{gap:18px}
    .cd-num{font-size:24px}
  }

  /* ---------- COUNTDOWN VIEW: photo of Yunji instead of the video ----------
     The photo has a white wall, so the header turns dark.
     Desktop: text sits on the empty wall to her left, in black.
     Phone/tablet: text sits at the bottom over her black hoodie, in white. */
  body.prelaunch .hero{background:#e8e8ea}
  body.prelaunch .hero video,body.prelaunch .pause{display:none}
  body.prelaunch .hero-photo{display:block}
  body.prelaunch header{color:var(--black)}
  body.prelaunch .logo img{filter:none}
  body.prelaunch .hero::after{
    background:linear-gradient(to bottom,rgba(236,236,238,.82),rgba(236,236,238,0) 16%)}
  /* countdown view: no way into the site — hide Shop, Collection, Lookbook, Cart and the menu.
     Only the logo (and Instagram on desktop) stay. The password opens the home view. */
  body.prelaunch .h-left > a,
  body.prelaunch .h-right a[href^="pro.html"],
  body.prelaunch .burger,
  body.prelaunch .panel,
  body.prelaunch .scrim{display:none !important}
  body.prelaunch .logo{pointer-events:none}

  @media (min-width:901px){
    body.prelaunch .hero-copy{left:max(26%,250px);color:var(--black)}
    body.prelaunch .cta{border-color:rgba(17,17,17,.9)}
    body.prelaunch .cta::before{background:var(--black)}
    body.prelaunch .cta:hover{color:#fff}
    body.prelaunch .wl-row input[type=email],
    body.prelaunch .lock-form input{background:rgba(255,255,255,.35);color:var(--black);border-color:rgba(17,17,17,.9)}
    body.prelaunch .wl-row input[type=email]::placeholder,
    body.prelaunch .lock-form input::placeholder{color:rgba(17,17,17,.55)}
    body.prelaunch .wl-row input[type=email]:focus{background:rgba(255,255,255,.65)}
    body.prelaunch .waitlist.bad input[type=email],
    body.prelaunch .lock.bad .lock-form input{border-color:#b3261e}
  }
  @media (max-width:900px){
    body.prelaunch .hero-copy{top:auto;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%)}
    body.prelaunch .hero::after{
      background:linear-gradient(to bottom,rgba(236,236,238,.82),rgba(236,236,238,0) 14%,rgba(0,0,0,0) 40%,rgba(0,0,0,.62))}
  }

  @media (prefers-reduced-motion:reduce){
    .hero-copy > *{animation:none;opacity:1;transform:none}
  }
</style>

<script>
const $ = s => document.querySelector(s);

/* ---------- LAUNCH TIME + PASSWORD ----------
   Countdown ends 15 October 2026, 12:00 PM Cambodia time (UTC+7).
   Then the page switches to the home view (video) for everyone.
   Before that, the page always opens on the countdown; entering the password
   switches to the home view for that visit (early access).
   The password is stored as a SHA-256 fingerprint, not as plain text. */
const LAUNCH = new Date("2026-10-15T12:00:00+07:00").getTime();
const ACCESS_HASH = "1cc2190628f386ed7d271193878b18bde9fee819fd20d660ec6d88016c2d86f8";   // password: set by ISALONE
const ACCESS_KEY  = "isalone_access";
const isLive = () => Date.now() >= LAUNCH;
const hasAccess = () => { if (isLive()) return true; try { return localStorage.getItem(ACCESS_KEY) === ACCESS_HASH; } catch(e) { return false; } };

/* ---------- photo + video ---------- */
const ph = $("#heroPhoto");
if (ph.complete && ph.naturalWidth) ph.classList.add("ready");
else ph.addEventListener("load", () => ph.classList.add("ready"), { once:true });

const v = $("#heroVideo");
let videoStarted = false;
function startVideo(){
  if (videoStarted) return; videoStarted = true;
  v.poster = v.dataset.poster;
  v.addEventListener("canplay", () => v.classList.add("ready"), { once:true });
  v.src = v.dataset.src;
  const p = v.play(); if (p) p.catch(() => {});
}
$("#toggleVideo").onclick = () => {
  const b = $("#toggleVideo");
  if (v.paused) { v.play(); b.textContent = "Pause"; b.setAttribute("aria-label","Pause background video"); }
  else { v.pause(); b.textContent = "Play"; b.setAttribute("aria-label","Play background video"); }
};

/* ---------- switch to the home view ---------- */
let cdTimer = null;
function showHome(){
  if (cdTimer) clearInterval(cdTimer);
  document.documentElement.classList.remove("pre");
  document.body.classList.remove("prelaunch");
  closeMenu();
  startVideo();
}

/* ---------- COUNTDOWN ---------- */
const pad = n => String(n).padStart(2, "0");
function tick(){
  const diff = LAUNCH - Date.now();
  if (diff <= 0) { showHome(); return; }
  const s = Math.floor(diff / 1000);
  $("#cdD").textContent = pad(Math.floor(s / 86400));
  $("#cdH").textContent = pad(Math.floor(s % 86400 / 3600));
  $("#cdM").textContent = pad(Math.floor(s % 3600 / 60));
  $("#cdS").textContent = pad(s % 60);
}

/* ---------- WAITLIST (EmailJS) ---------- */
const EMAILJS_PUBLIC_KEY  = "ESQBsB5V99RS3RoGA";
const EMAILJS_SERVICE_ID  = "service_ecewbh8";
const EMAILJS_TEMPLATE_ID = "template_ega07sg";
const EMAIL_TITLE = "Your Drop 001 poster";
const POSTER_PATH = "./img/poster.jpg";

/* DEBUG: true while testing — shows the real EmailJS error and lets you resend to the same email. */
const DEBUG = true;

const wl = $("#waitlist"), wlEmail = $("#wlEmail"), wlMsg = $("#wlMsg"), wlBtn = $("#wlBtn");
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const emailjsReady = () => window.emailjs && !EMAILJS_PUBLIC_KEY.startsWith("YOUR_") && !EMAILJS_TEMPLATE_ID.startsWith("PUT_");
if (emailjsReady()) emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

const WL_KEY = "isalone_waitlist_emails";
const joined = () => { try { const a = JSON.parse(localStorage.getItem(WL_KEY)); return Array.isArray(a) ? a : []; } catch(e){ return []; } };
const remember = email => { try { const a = joined(); if (!a.includes(email)) a.push(email); localStorage.setItem(WL_KEY, JSON.stringify(a)); } catch(e){} };
try { const old = localStorage.getItem("isalone_waitlist"); if (old) { remember(old); localStorage.removeItem("isalone_waitlist"); } } catch(e){}

wlEmail.addEventListener("input", () => { wl.classList.remove("bad"); wlMsg.textContent = ""; });

wl.addEventListener("submit", async e => {
  e.preventDefault();
  const email = wlEmail.value.trim().toLowerCase();
  if (!validEmail(email)) { wl.classList.add("bad"); wlMsg.textContent = "Please enter a valid email."; wlEmail.focus(); return; }
  if (wl.company.value) return;                       // bot filled the hidden field
  if (!DEBUG && joined().includes(email)) { wlMsg.textContent = "You're already on the waitlist."; return; }
  if (!window.emailjs) { wlMsg.textContent = DEBUG ? "Error: EmailJS script did not load (ad blocker?)" : "Waitlist isn't connected yet."; return; }
  if (!emailjsReady()) { wlMsg.textContent = "Waitlist isn't connected yet."; return; }

  wlBtn.disabled = true; wlMsg.textContent = "Sending…";
  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email:   email,
      title:      EMAIL_TITLE,
      email:      email,
      user_email: email,
      reply_to:   email,
      poster_url: new URL(POSTER_PATH, location.href).href,
      site_url:   new URL("./", location.href).href,
      logo_url:   new URL("./img/logo.png", location.href).href,
      instagram_url: "https://www.instagram.com/isalone_studio"
    });
    remember(email);
    wlEmail.value = "";
    wlMsg.textContent = "Thank you. Check your inbox.";
    if (!isLive()) setTimeout(openLock, 1200);        // next step: the password box
  } catch (err) {
    console.error("EmailJS:", err);
    wlMsg.textContent = DEBUG
      ? "Error " + (err?.status || "") + ": " + (err?.text || err?.message || "unknown")
      : "Something went wrong. Please try again.";
  } finally { wlBtn.disabled = false; }
});

/* ---------- PASSWORD LOCK ---------- */
async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}
const lock = $("#lock"), lockPw = $("#lockPw"), lockMsg = $("#lockMsg");
function openLock(){
  if (isLive()) return;
  lock.classList.add("open"); $("#lockToggle").setAttribute("aria-expanded","true"); setTimeout(()=>lockPw.focus(), 50);
}
$("#lockToggle").onclick = openLock;
lockPw.addEventListener("input", () => { lock.classList.remove("bad"); lockMsg.textContent = ""; });
$("#lockForm").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = lockPw.value.trim();
  if (!pw) { lockPw.focus(); return; }
  let ok = false;
  try { ok = (await sha256("isalone:" + pw)) === ACCESS_HASH; } catch(err) { console.error(err); }
  if (ok) {
    try { localStorage.setItem(ACCESS_KEY, ACCESS_HASH); } catch(e){}
    lockMsg.textContent = "Welcome.";
    setTimeout(showHome, 500);                        // same page, now showing the home view
  } else {
    lock.classList.remove("bad"); void lock.offsetWidth; lock.classList.add("bad");
    lockMsg.textContent = "Wrong password.";
    lockPw.select();
  }
});

// Before launch, every link into the site (Shop, Collection, Cart, Lookbook) needs the password.
document.querySelectorAll('a[href^="pro.html"], a[href^="lookbook.html"]').forEach(a => a.addEventListener("click", e => {
  if (hasAccess()) return;
  e.preventDefault(); closeMenu(); openLock();
}));

/* ---------- cart count (shared with pro.html and checkout.html) ---------- */
function cartCount(){
  let n = 0;
  try { const c = JSON.parse(localStorage.getItem("isalone_cart")); if (Array.isArray(c)) n = c.reduce((s,i)=>s+(i.qty||1),0); } catch(e){}
  $("#cartCount").textContent = n;
}
cartCount(); addEventListener("pageshow", cartCount); addEventListener("storage", cartCount);

/* ---------- mobile menu ---------- */
function closeMenu(){ $("#menu").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#openMenu").onclick = () => { $("#menu").classList.add("on"); $("#scrim").classList.add("on"); };
$("#scrim").onclick = closeMenu;
document.querySelectorAll("[data-close], .menu-links a").forEach(b => b.addEventListener("click", closeMenu));
addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });

/* ---------- start ---------- */
if (isLive()) showHome();
else {
  tick();
  cdTimer = setInterval(tick, 1000);
  // opened from a locked page (pro.html?locked) → show the password box right away
  if (new URLSearchParams(location.search).has("locked")) openLock();
}
</script>
</body>
</html>
